name: home_widget
description: >
  Planbook fork of home_widget. Android 端移除 Glance 与 background 自启动组件，
  以满足国内应用商店合规要求。上游：https://github.com/ABausG/home_widget
version: 0.9.1-planbook.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  path_provider_foundation: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: es.antonborri.home_widget
        pluginClass: HomeWidgetPlugin
      ios:
        pluginClass: HomeWidgetPlugin
