name: planbook_widget
description: Planbook 小组件与 App 之间的事件桥接插件（Android + iOS）。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.20.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.bapaws.planbook_widget
        pluginClass: PlanbookWidgetPlugin
      ios:
        pluginClass: PlanbookWidgetPlugin
