  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.2.0
  fluttertoast: ^8.2.11
  fluwx: ^5.0.0
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.3.0
  http: ^1.6.0
  hydrated_bloc: ^10.1.1
  image_cropper: ^11.0.0
  image_picker: ^1.1.2
  in_app_review: ^2.0.10
  install_plugin_v3: ^3.1.3
  intl: ^0.20.2
  internet_connection_checker: ^3.0.1
  jiffy: ^6.3.1
  octo_image: ^2.1.0
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  photo_view: ^0.15.0
  planbook_api:
    path: packages/planbook_api
  planbook_core:
    path: packages/planbook_core
  planbook_repository:
    path: packages/planbook_repository
  planbook_widget:
    path: packages/planbook_widget
  pull_down_button: ^0.10.2
  purchases_flutter: 9.9.9
  redeem_client:
    git:
      url: https://github.com/bapaws/redeem_code.git
      path: client/flutter/redeem_client
      ref: main
  rxdart: ^0.28.0
  saver_gallery: ^4.0.0
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  sliver_tools: ^0.2.12
  sqlite3: ^2.7.7
  sqlite3_flutter_libs: ^0.5.37
  supabase_flutter: ^2.9.1
  supabase_planbook_api:
    path: packages/supabase_planbook_api
  tab_indicator_styler: ^2.0.0
  table_calendar: ^3.2.0
  tobias: ^5.3.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1

  # —— 鸿蒙平台实现（不影响其他平台构建）——
  # pub.dev 直引（SDK 约束兼容 Dart 3.9）
  app_links_ohos: ^0.2.0
  fluttertoast_ohos: ^9.0.0
  # OpenHarmony SIG gitcode 仓库
  shared_preferences_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos
  path_provider_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider_ohos
  url_launcher_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/url_launcher/url_launcher_ohos
  image_picker_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker_ohos
  # pub.dev 版 SDK 约束停留在 Dart 2.x，vendor 后放宽（packages/ohos_vendor）
  connectivity_plus_ohos:
    path: packages/ohos_vendor/connectivity_plus_ohos
  device_info_plus_ohos:
    path: packages/ohos_vendor/device_info_plus_ohos
  package_info_plus_ohos:
    path: packages/ohos_vendor/package_info_plus_ohos
  permission_handler_ohos:
    path: packages/ohos_vendor/permission_handler_ohos
  app_settings_ohos:
    path: packages/ohos_vendor/app_settings_ohos
  flutter_timezone_ohos:
    path: packages/ohos_vendor/flutter_timezone_ohos

dev_dependencies:
  auto_route_generator: ^10.2.3
  bloc_test: ^10.0.0
  build_runner: ^2.4.2
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

dependency_overrides:
  redeem_client:
    path: ../../redeem_code/client/flutter/redeem_client
  # 鸿蒙适配：vendor 3.7.2，修复 TargetPlatform 穷尽 switch 在 OHOS 分支 SDK 下的编译错误
  flex_color_picker:
    path: packages/flex_color_picker
  # 鸿蒙适配：sqlite3 FFI。2.9.4 分支含 ohos 加载逻辑（DynamicLibrary.open('libsqlite3.so')），
  # 原生 .so 由 sqlite3_flutter_libs 0.5.25-ohos 提供；版本满足 drift 的 ^2.6.0 约束
  sqlite3:
    git:
      url: https://ghproxy.net/https://github.com/SageMik/sqlite3-ohos.dart.git
      path: sqlite3
      ref: sqlite3-2.9.4
  sqlite3_flutter_libs:
    git:
      url: https://ghproxy.net/https://github.com/SageMik/sqlite3-ohos.dart.git
      path: sqlite3_flutter_libs
      ref: sqlite3_flutter_libs-0.5.25-ohos
  # 鸿蒙适配：sqflite（flutter_cache_manager 传递依赖）走 gitcode 适配版
  sqflite:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_sqflite.git
      path: sqflite
  sqflite_common:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_sqflite.git
      path: sqflite_common

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/images/
    - assets/tiles/
    - assets/files/
    - assets/audios/
    # - assets/demo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

tobias:
  url_scheme: planbook.bapaws
  ios:
    ignore_security: true
    universal_link: https://bapaws.github.io
